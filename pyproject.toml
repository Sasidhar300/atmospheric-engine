[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atmosphere-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<2.3", "scipy>=1.12", "opencv-python-headless>=4.9", "Pillow>=10", "PyYAML>=6"]

[project.scripts]
atmosphere = "atmosphere.cli:main"

[tool.setuptools.packages.find]
include = ["atmosphere*"]
